[build-system]

requires = ["setuptools", "setuptools-scm", "wheel", "cython"]

build-backend = 'setuptools.build_meta'

[project]
name = "ultraimport"
description='Get control over your imports -- no matter how you run your code.'
readme = "readme.md"
license-files = ["license.txt"]
version = "0.1.2"
dependencies= []
requires-python = '>=3.9'

[[project.authors]]
name = "Ronny Rentner"
email = "ultraimport.code@ronny-rentner.de"

[project.urls]
Homepage = "https://github.com/ronny-rentner/ultraimport"
Repository = "https://github.com/ronny-rentner/ultraimport"
Documentation = "https://github.com/ronny-rentner/ultraimport/tree/main/docs"

[tool.setuptools]
# FIXME: Does not work, the files are still included
include-package-data = false
packages = ["ultraimport"]
[tool.setuptools.package-dir]
ultraimport = "."

[tool.cibuildwheel]
# 3.15 is still a release candidate and not in the test matrix, drop this once it is final.
# Free-threaded builds are skipped as the extension does not declare free-threading support, so
# Python re-enables the GIL with a warning on import.
skip = ["cp315*", "cp3*t-*"]
test-command = "python {project}/tests/tests.py"
